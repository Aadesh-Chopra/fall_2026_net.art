<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Treasure Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="map">

    <h1 id="title">Treasure Map</h1>

    <div class="sea" id="bay-water"></div>

    <div class="spot" id="skull">
      <p class="place">Skull Rock</p>
      <img src="images/images (3).jpg" alt="A rock shaped like a skull">
    </div>

    <div class="spot" id="bay">
      <p class="place">Shark Bay</p>
      <img src="images/images.jpg" alt="A shark fin in the water">
    </div>

    <div class="spot" id="swamp">
      <p class="place">Foggy Swamp</p>
      <img src="images/images (1).jpg" alt="A foggy swamp">
    </div>

    <div class="spot" id="cave">
      <p class="place">Cave of Echoes</p>
      <img src="images/images (2).jpg" alt="A dark cave entrance">
    </div>

    <p class="x" id="fake-x">X</p>
    <p class="taunt" id="fake-taunt">Nice try. The treasure is <span class="red">not</span> here.</p>

    <div class="spot" id="treasure-spot">
      <p class="x">X</p>
      <img id="chest" src="images/images (4).jpg" alt="A treasure chest">
    </div>

  </div>

</body>
</html>
